# Netlify build & runtime configuration for AVCT.
#
# Frontend : Vite build at the repo root -> dist/
# Backend  : one Netlify Function (v2, ESM) serving every /api/* route.
# Database : Neon Postgres over HTTP. Set these environment variables under
#            Site configuration -> Environment variables:
#              DATABASE_URL    (required)  Neon pooled connection string
#              ADMIN_PASSWORD  (optional)  defaults to 0314
#              SESSION_SECRET  (recommended) long random string

[build]
  command = "npm run build"
  publish = "dist"
  # Every push to main rebuilds, and free-tier build minutes are finite. Skip
  # the build when a commit touched nothing the deployed site is made of: the
  # design canvas, documentation, the handoff, and local-only tooling under
  # scripts/. Exit 0 skips the build, exit 1 runs it — so an empty diff over
  # everything that matters means there is nothing to deploy.
  #
  # $CACHED_COMMIT_REF is the last commit Netlify built successfully, so a push
  # of several commits at once is compared as a whole. It is EMPTY on a new
  # site and whenever the cache is cleared, and an empty ref must mean "build":
  # left unguarded it collapses to a diff against the working tree, which in a
  # fresh checkout is clean, returns 0, and would skip the build forever. The
  # `test -n` guard fails in that case, short-circuits the &&, and builds.
  #
  # To force a skip on a commit this rule would otherwise build, put [skip ci]
  # in the commit message. To force a build, touch any file outside the
  # exclusions.
  ignore = "test -n \"$CACHED_COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)design' ':(exclude)*.md' ':(exclude).claude' ':(exclude)scripts' ':(exclude).shots'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # The functions import the shared form model straight from src/.
  included_files = ["src/form/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # /admin holds applicant personal data — never let a search engine index it.
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  # SPA fallback. /api/* is claimed by the function's own `config.path`,
  # which Netlify evaluates before this rule.
  from = "/*"
  to = "/index.html"
  status = 200
