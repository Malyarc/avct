<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;600&display=swap">
  <style>
    :root{
      --green-900:#063F2A; --green-800:#01603E; --green-700:#0A7350; --green-300:#8ACDB2;
      --green-100:#D9EDE3; --green-50:#EFF7F2; --leaf:#84C920;
      --paper:#FAF8F4; --card:#FFFFFF; --line:#E6E1D7; --line-soft:#F0EDE5;
      --ink:#1B211E; --muted:#5C665F; --faint:#8A938C;
      --shadow-sm:0 1px 2px rgba(4,41,28,.06), 0 1px 3px rgba(4,41,28,.04);
      --shadow-md:0 2px 4px rgba(4,41,28,.04), 0 12px 28px -8px rgba(4,41,28,.12);
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--paper);color:var(--ink);
      font-family:"Noto Serif TC","Instrument Sans",-apple-system,sans-serif;
      -webkit-font-smoothing:antialiased;text-wrap:pretty;}
    h1,h2,h3{font-family:"Noto Serif TC","Source Serif 4",Georgia,serif;font-weight:600;margin:0;
      letter-spacing:.01em;text-wrap:balance;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
      box-shadow:var(--shadow-sm);}
    /* 44px minimum touch target, matching the shipped control. */
    .day{display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;
      border:1px solid var(--line);background:var(--card);border-radius:9px;
      font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.02em;}
    .day.on{border-color:var(--green-800);background:var(--green-800);color:#fff;font-weight:600;}
  </style>
</helmet>

<div style="width:390px;min-height:1180px;background:var(--paper);display:flex;flex-direction:column;">

  <!-- ── Header: brand, language toggle set to 中文 ─────────── -->
  <header style="background:var(--card);border-bottom:1px solid var(--line-soft);padding:12px 18px 0;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;">
      <div style="display:flex;align-items:center;gap:9px;min-width:0;">
        <img src="./logo.png" alt="慈濟" style="width:30px;height:auto;display:block;flex:none;">
        <div style="display:flex;flex-direction:column;min-width:0;">
          <span style="font-size:13.5px;font-weight:600;line-height:1.3;">可參與時間</span>
          <span style="font-size:11px;color:var(--faint);line-height:1.3;">第 7 步，共 9 步 &middot; 第 12 項</span>
        </div>
      </div>
      <span style="display:inline-flex;align-items:center;border:1px solid var(--line);
        background:var(--card);border-radius:999px;padding:2px;flex:none;">
        <span style="font-size:11.5px;font-weight:600;color:var(--muted);padding:5px 10px;
          font-family:'Instrument Sans',sans-serif;">EN</span>
        <span style="font-size:11.5px;font-weight:600;color:#fff;background:var(--green-800);
          border-radius:999px;padding:5px 11px;letter-spacing:.04em;">中文</span>
      </span>
    </div>
    <div style="height:4px;border-radius:999px;background:var(--line-soft);overflow:hidden;">
      <div style="width:77%;height:100%;background:var(--green-700);border-radius:999px;"></div>
    </div>
    <div style="display:flex;gap:7px;overflow:hidden;padding:11px 0 12px;">
      <span style="flex:none;font-size:11.5px;color:var(--green-700);border:1px solid var(--green-100);
        background:var(--green-50);border-radius:999px;padding:4px 10px;">5 志工經歷</span>
      <span style="flex:none;font-size:11.5px;color:var(--green-700);border:1px solid var(--green-100);
        background:var(--green-50);border-radius:999px;padding:4px 10px;">6 專長</span>
      <span style="flex:none;font-size:11.5px;color:#fff;background:var(--green-800);
        border-radius:999px;padding:4px 11px;font-weight:600;">7 可參與時間</span>
      <span style="flex:none;font-size:11.5px;color:var(--faint);border:1px solid var(--line);
        border-radius:999px;padding:4px 10px;">8 尺寸</span>
    </div>
  </header>

  <main style="flex-grow:1;display:flex;flex-direction:column;gap:16px;padding:20px 18px 26px;">

    <div style="display:flex;flex-direction:column;gap:7px;">
      <h1 style="font-size:24px;line-height:1.3;">您方便參與的時間</h1>
      <p style="margin:0;font-size:14.5px;line-height:1.65;color:var(--muted);">
        請勾選您每週方便參與培訓與活動的時段，可複選。
      </p>
    </div>

    <!-- 上午 — all seven days selected via 全選 -->
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <span style="font-size:15px;font-weight:600;color:var(--green-900);">上午</span>
        <span style="font-size:13px;font-weight:600;color:var(--green-700);">清除</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;">
        <span class="day on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>一</span>
        <span class="day on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>二</span>
        <span class="day on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>三</span>
        <span class="day on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>四</span>
        <span class="day on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>五</span>
        <span class="day on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>六</span>
        <span class="day on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>日</span>
      </div>
    </div>

    <!-- 下午 — weekend only -->
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <span style="font-size:15px;font-weight:600;color:var(--green-900);">下午</span>
        <span style="font-size:13px;font-weight:600;color:var(--green-700);">全選</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;">
        <span class="day">一</span>
        <span class="day">二</span>
        <span class="day">三</span>
        <span class="day">四</span>
        <span class="day">五</span>
        <span class="day on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>六</span>
        <span class="day on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>日</span>
      </div>
    </div>

    <!-- 晚上 — nothing selected -->
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <span style="font-size:15px;font-weight:600;color:var(--green-900);">晚上</span>
        <span style="font-size:13px;font-weight:600;color:var(--green-700);">全選</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;">
        <span class="day">一</span>
        <span class="day">二</span>
        <span class="day">三</span>
        <span class="day">四</span>
        <span class="day">五</span>
        <span class="day">六</span>
        <span class="day">日</span>
      </div>
    </div>

    <div style="display:flex;gap:10px;align-items:flex-start;background:var(--green-50);
      border:1px solid var(--green-100);border-radius:11px;padding:13px 15px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#01603E" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px;">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span style="font-size:13px;line-height:1.6;color:var(--green-900);">
        已選 9 個時段。手機版每個時段獨立一張卡片，桌機版則使用與紙本表格相同的七日格線。
      </span>
    </div>
  </main>

  <!-- ── Sticky action bar ─────────────────────────────────── -->
  <div style="position:sticky;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
    padding:12px 18px;display:flex;gap:10px;align-items:center;">
    <span style="display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
      color:var(--muted);font-size:14.5px;font-weight:600;border-radius:11px;padding:0 16px;height:48px;flex:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      上一步
    </span>
    <span style="flex-grow:1;display:flex;align-items:center;justify-content:center;gap:8px;
      background:var(--green-800);color:#fff;font-size:15.5px;font-weight:600;border-radius:11px;height:48px;
      box-shadow:var(--shadow-md);">
      下一步
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
