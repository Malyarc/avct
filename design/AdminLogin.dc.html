<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;600&display=swap">
  <style>
    :root{
      --green-950:#04291C; --green-900:#063F2A; --green-800:#01603E; --green-700:#0A7350;
      --green-300:#8ACDB2; --green-100:#D9EDE3; --green-50:#EFF7F2; --leaf:#84C920;
      --line:#E6E1D7; --ink:#1B211E; --muted:#5C665F; --faint:#8A938C;
      --shadow-lg:0 4px 8px rgba(0,0,0,.14), 0 30px 70px -18px rgba(0,0,0,.5);
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--green-950);color:#fff;
      font-family:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;text-wrap:pretty;}
    h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;margin:0;letter-spacing:-0.012em;}
    a{color:var(--leaf);text-decoration:none;} a:hover{text-decoration:underline;}
    .zh{font-family:"Noto Serif TC",serif;}
  </style>
</helmet>

<div style="width:1120px;height:800px;background:var(--green-950);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">

  <div style="position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:900px;height:520px;
    background:radial-gradient(ellipse at center,rgba(132,201,32,.10),rgba(132,201,32,0) 66%);pointer-events:none;"></div>
  <div style="position:absolute;bottom:-220px;left:-120px;width:640px;height:520px;
    background:radial-gradient(ellipse at center,rgba(1,96,62,.55),rgba(1,96,62,0) 68%);pointer-events:none;"></div>

  <div style="position:relative;width:412px;display:flex;flex-direction:column;gap:26px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;">
      <img src="./logo.png" alt="Tzu Chi" style="width:66px;height:auto;display:block;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <h1 style="font-size:27px;color:#fff;">AVCT Admin</h1>
        <p style="margin:0;font-size:14px;color:#8FA79A;line-height:1.55;">
          Talent Cultivation Department &middot; Internal access only
        </p>
      </div>
    </div>

    <div style="background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:16px;
      padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow-lg);backdrop-filter:blur(8px);">

      <div style="display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:13px;font-weight:600;color:#DDE7E1;">Access code</span>
        <div style="height:52px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.22);border-radius:11px;
          padding:0 16px;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:22px;letter-spacing:.5em;color:#fff;font-weight:600;">&bull;&bull;&bull;&bull;</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FA79A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>

      <span style="display:flex;align-items:center;justify-content:center;gap:10px;background:var(--leaf);color:var(--green-950);
        font-size:15px;font-weight:700;border-radius:11px;padding:14px 0;">
        Sign in
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </span>

      <div style="display:flex;gap:10px;align-items:flex-start;padding-top:4px;border-top:1px solid rgba(255,255,255,.09);margin-top:2px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8FA79A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:3px;"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span style="font-size:12.5px;line-height:1.55;color:#8FA79A;padding-top:2px;">
          This page is reachable by direct link only. It is never linked from the applicant site.
        </span>
      </div>
    </div>

    <div style="text-align:center;font-size:12.5px;color:#6C8478;">
      Buddhist Tzu Chi Foundation &middot; National Headquarters
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
